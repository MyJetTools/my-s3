[package]
name = "my-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# `with-ring-tls` is not optional here: fl-url's `default = []` compiles the TLS
# code paths out entirely, and S3 is always addressed over `https://`. Without a
# provider feature every request dies at connect time with my-tls' "No rustls
# CryptoProvider is installed". `with-rust-tls` is the pure-Rust alternative, but
# it builds only on x86_64/aarch64 - ring is the one that works everywhere.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git", features = [
    "with-ring-tls",
] }
my-xml-reader = { tag = "0.1.1", git = "https://github.com/MyJetTools/my-xml-reader" }

# `RequestBodyStream` lives here and `flurl` does not re-export it (only `hyper`,
# `my_tls` and `my_http_utils`). The tag MUST stay equal to the one `flurl` pins,
# otherwise the graph ends up with two `hyper::body::Body` traits and
# `put_request_streamed` stops accepting our body with a "trait not implemented" that
# looks like a library bug.
my-http-client = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-http-client.git" }
tokio = { version = "*", features = ["sync"] }

[dev-dependencies]
tokio = { version = "*", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
